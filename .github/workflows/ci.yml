name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Third-party actions are pinned to a COMMIT SHA, with the human-readable
# version in the trailing comment. A tag is a moving pointer: `@v7` and even
# `@v0.10.0` can be repointed at any time by whoever owns the repo, and the
# deploy job below runs those actions with five secrets and an authenticated SSH
# agent already in its environment. A retag there is remote code execution
# against our production credentials, with no diff and no review. A SHA can't be
# moved.
#
# This does NOT freeze updates — dependabot understands SHA pins and bumps both
# the SHA and the version comment. To change one by hand, resolve the tag to the
# COMMIT it points at:
#   git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'
# and take the `refs/tags/<tag>^{}` line if there is one. An ANNOTATED tag has
# its own object, and `--refs` hides exactly that peel line — pin the tag object
# by mistake and dependabot no longer recognises the pin as a version, so the
# action silently stops being updated. setup-chrome below is annotated; the other
# three are lightweight, where the ref is already the commit.
#
# Runs the full bin/ci (system tests included) on every push and PR — this is
# the authoritative "is main mergeable?" gate; require it as a branch-protection
# status check on main. The local pre-push hook only runs `bin/ci --fast`
# (skips test:system) so `git push` stays quick — this workflow is what catches
# the rest before merge. While the repo is docs-only (no Gemfile), bin/ci exits
# 0 and this workflow stays green; once the app is scaffolded the full suite
# runs.
jobs:
  ci:
    runs-on: ubuntu-latest
    # Cap the whole job; the default is 6h, which is far too long for a hung
    # system test or a wedged browser. Bump if the real suite outgrows it.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a scaffolded app
        id: app
        run: |
          if [ -f Gemfile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Gemfile yet — app not scaffolded; bin/ci will no-op."
          fi

      - name: Set up Ruby
        if: steps.app.outputs.present == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
        timeout-minutes: 10

      - name: Install Chrome for system tests
        id: chrome
        if: steps.app.outputs.present == 'true'
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          # Stated, not defaulted: v1 defaulted to bleeding-edge Chromium
          # snapshots, v2 to the Chrome for Testing stable channel. Pin the
          # channel we want so a future default can't move the suite's browser.
          chrome-version: stable
        timeout-minutes: 5

      - name: Run CI (bin/ci)
        # Point Cuprite at the binary the step above installed rather than
        # letting it guess from PATH; the tiers it falls back to live in
        # test/application_system_test_case.rb.
        #
        # Then fail loudly if that binary never arrived. The fallback exists for
        # the sandbox and for laptops, and on a runner it would quietly hand the
        # suite whatever Chrome the image happens to ship — voiding the version
        # pinned above with a green check and no signal. A pin you can't detect
        # losing isn't a pin.
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "::error title=No browser::setup-chrome reported no chrome-path; refusing to run the system suite against an unpinned browser."
            exit 1
          fi
          chmod +x bin/ci
          bin/ci
        timeout-minutes: 15

  # Auto-deploy to the Hetzner VM with Kamal once CI is green — the same
  # bin/kamal deploy, config/deploy.yml, and .kamal/secrets used by hand, only
  # with the values coming from repo Secrets/Variables. See
  # docs/deploy-hetzner-cloudflare.md → §8.
  deploy:
    needs: ci
    # Ship ONLY on a real push to main. github.ref and github.event_name are set
    # by GitHub and can't be forged: a pull request (fork or not) has
    # event_name == 'pull_request' and ref == 'refs/pull/N/merge', never
    # 'refs/heads/main', so untrusted PR code never reaches this secret-bearing
    # job. Because deploy is a gated job in the SAME workflow — not a separate
    # workflow_run — there is no privileged-workflow-runs-fork-code path, so no
    # extra pwn-request guard is needed.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Serialise releases; let an in-flight rollout finish rather than cancelling
    # it half-applied.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      # Deploy target — non-secret, from repo Variables. config/deploy.yml reads
      # these via ERB (image/registry user, servers + db host, proxy host).
      KAMAL_REGISTRY_USER: ${{ vars.KAMAL_REGISTRY_USER }}
      STABLEMATE_SERVER_IP: ${{ vars.STABLEMATE_SERVER_IP }}
      STABLEMATE_HOST: ${{ vars.STABLEMATE_HOST }}
      # Also ERB-read by deploy.yml, and also ENV.fetch'd with no default, so a
      # deploy without them dies on a KeyError rather than falling back.
      STABLEMATE_MAIL_FROM: ${{ vars.STABLEMATE_MAIL_FROM }}
      STABLEMATE_MAIL_REPLY_TO: ${{ vars.STABLEMATE_MAIL_REPLY_TO }}
      # Secrets — consumed by .kamal/secrets (env-first, file fallback).
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      STABLEMATE_DATABASE_PASSWORD: ${{ secrets.STABLEMATE_DATABASE_PASSWORD }}
      STABLEMATE_SSL_CERT: ${{ secrets.STABLEMATE_SSL_CERT }}
      STABLEMATE_SSL_KEY: ${{ secrets.STABLEMATE_SSL_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}
      # Read by the preflight below as well as by ssh-agent. A secret can't be
      # referenced from a job- or step-level `if:` (the secrets context isn't
      # available there), so the only way to *test* one is to surface it as env
      # first — which is why this lives here rather than inline on its step.
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    steps:
      # Checkout is unconditional because the preflight below reads the repo to
      # work out what a deploy needs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Deploying needs a set of secrets and variables that only the owner of a
      # real server can supply. Until they are set, every push to main failed
      # here — a permanently red main that trains you to ignore the X, and would
      # hide a genuine CI failure behind an expected one. So: check first, and
      # skip the rest of the job cleanly when the deploy isn't configured.
      #
      # DERIVED, not listed. The first version of this step kept its own list of
      # names, and that list was wrong the day it was written: config/deploy.yml
      # ENV.fetches STABLEMATE_MAIL_FROM and STABLEMATE_MAIL_REPLY_TO with no
      # default, neither was in the list, so a fully configured repo would have
      # passed this check and then died inside `kamal deploy` on a KeyError —
      # the exact failure the step exists to prevent. Reading the requirement
      # out of the files that declare it means a new ENV.fetch in deploy.yml or
      # a new $VAR in .kamal/secrets is covered with no edit here, and a name
      # that never reaches the job `env:` block above reports as missing rather
      # than failing later.
      #
      # Deliberately NOT a silent skip: it emits a notice naming exactly what is
      # absent, so "we never set this up" and "our deploy broke" stay
      # distinguishable — the whole point of turning the red green is that red
      # starts meaning something again. Only names are printed, never values.
      - name: Check the deploy is configured
        id: preflight
        run: |
          required=$(
            {
              # ENV.fetch("X") with no second argument — a fetch WITH a default
              # cannot fail, so it isn't a requirement.
              grep -oE 'ENV\.fetch\("[A-Z_0-9]+"\)' config/deploy.yml
              # Every variable .kamal/secrets interpolates, comments stripped so
              # the 1Password example in the header doesn't count.
              sed 's/#.*//' .kamal/secrets | grep -oE '\$\{?[A-Z_0-9]+\}?'
              # Needed by this workflow itself; declared in neither file.
              printf 'SSH_PRIVATE_KEY\nKNOWN_HOSTS\n'
            } | grep -oE '[A-Z_0-9]{4,}' | sort -u
          )

          missing=""
          for name in $required; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done

          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Auto-deploy skipped::Not configured — set these repo Secrets/Variables to enable it:$missing"
            echo "Auto-deploy is not configured. Missing:$missing"
            echo "Nothing was deployed. Deploy by hand with bin/kamal deploy, or add the values above."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Ruby (gives us bin/kamal)
        if: steps.preflight.outputs.ready == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Load the deploy key into ssh-agent
        if: steps.preflight.outputs.ready == 'true'
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust the server host key
        if: steps.preflight.outputs.ready == 'true'
        # From a KNOWN_HOSTS secret (ssh-keyscan <ip> on your laptop, paste the
        # output) rather than scanning at deploy time — deterministic, and it
        # can't be silently poisoned by a MITM during the run.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: kamal deploy
        if: steps.preflight.outputs.ready == 'true'
        # Kamal builds the amd64 image on the runner, logs in and pushes to the
        # registry itself (KAMAL_REGISTRY_PASSWORD), then rolls it out over SSH;
        # migrations run on boot.
        run: bin/kamal deploy
